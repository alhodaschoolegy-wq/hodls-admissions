<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل دخول الإدارة | H-O-D-L-S</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="shortcut icon" type="image/png" href="logo.png">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Icons Library: FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- SweetAlert2 Library -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Unified Admin CSS -->
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>

  <!-- Secure Login View -->
  <div id="loginView" class="login-container">
    <div class="login-card">
      <div class="login-card-header">
        <img class="mark" src="logo.png" onerror="this.onerror=null; this.src='school-logo.svg';" alt="شعار مدرسة الهُدى">
        <h1>لوحة إدارة التنسيق والقبول</h1>
        <p>مدرسة الهُدى الرسمية المتميزة للغات (H-O-D-L-S)</p>
      </div>

      <form id="loginForm">
        <div class="login-field">
          <label for="adminUsername"><i class="fa-solid fa-user"></i> اسم المستخدم (Username)</label>
          <input type="text" id="adminUsername" placeholder="اسم المستخدم المصرح له" required autocomplete="username" autofocus>
        </div>

        <div class="login-field">
          <label for="adminPassword"><i class="fa-solid fa-lock"></i> كلمة المرور (Password)</label>
          <div class="password-field-wrapper">
            <input type="password" id="adminPassword" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" id="btnTogglePassword" class="btn-toggle-password" title="إظهار كلمة المرور">
              <i class="fa-solid fa-eye" id="togglePasswordIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="btnLogin">
          <i class="fa-solid fa-shield-halved"></i> دخول آمن للمنظومة (JWT Auth)
        </button>
        <div id="loginError" class="err-box"></div>

        <!-- Security Shield Badge -->
        <div style="margin-top:16px; text-align:center; font-size:11.5px; color:#5c7064; display:flex; align-items:center; justify-content:center; gap:6px;">
          <i class="fa-solid fa-shield-check" style="color:var(--primary);"></i>
          <span>بوابة دخول محمية بتقنيات <strong>JWT Tokens</strong> &amp; <strong>Bcrypt</strong></span>
        </div>

        <div style="margin-top:20px; padding-top:14px; border-top:1px solid var(--border); text-align:center;">
          <a href="/" style="display:inline-flex; align-items:center; gap:8px; color:var(--primary-dark); font-weight:800; font-size:13px; text-decoration:none; background:#f0fdf4; padding:8px 16px; border-radius:8px; border:1px solid #c9dcd1;">
            <i class="fa-solid fa-house"></i> العودة لبوابة الطلاب والتقديم
          </a>
        </div>
      </form>
    </div>
  </div>

  <script src="assets/js/adminCommon.js"></script>
  <script>
    setupLoginForm((user) => {
      const params = new URLSearchParams(window.location.search);
      let redirect = params.get("redirect") || "/dashboard";
      if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
        if (!redirect.endsWith(".html")) redirect += ".html";
      }
      window.location.href = redirect;
    });

    (async () => {
      try {
        const res = await apiRequest("me");
        if (res && res.user) {
          const params = new URLSearchParams(window.location.search);
          let redirect = params.get("redirect") || "/dashboard";
          if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
            if (!redirect.endsWith(".html")) redirect += ".html";
          }
          window.location.href = redirect;
        }
      } catch {
        // Not logged in, stay on login view
      }
    })();
  </script>
</body>
</html>
